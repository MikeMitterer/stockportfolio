#------------------------------------------------------------------------------
# Server-Block für die ausgelieferte App — ausschließlich wegen des Cachings.
#
# Der Router läuft im Hash-Modus, der Server sieht also immer nur "/". Ein
# Rückfall auf die index.html ist damit nicht mehr nötig; was hier steht, hat
# mit Routing nichts zu tun.
#
# Nötig ist es trotzdem, und zwar nachweislich: Ohne Cache-Control schickt
# nginx zur index.html nur Last-Modified und ETag. Browser cachen sie dann
# heuristisch — nach einem Container-Update lud der Browser weiter die alte
# index.html und forderte Bündel-Dateien an, die es im neuen Abbild nicht mehr
# gibt (deren Namen enthalten einen Hash). Ergebnis: 404 und eine App, die beim
# Seitenwechsel stehen bleibt, bis jemand hart neu lädt.
#
# Dieselbe Falle gilt für config.js — sie entscheidet, welches Backend die App
# anspricht, und wird bei jedem Start neu geschrieben.
#------------------------------------------------------------------------------

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Gebündelte Dateien tragen einen Hash im Namen: Ändert sich der Inhalt,
    # ändert sich der Name. Ein Jahr Cache ist damit unbedenklich.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Alles andere — vor allem index.html und config.js — bei jedem Aufruf
    # gegenprüfen lassen. 'no-cache' verbietet nicht das Speichern, sondern
    # das Ausliefern ohne Rückfrage.
    location / {
        add_header Cache-Control "no-cache" always;
    }
}
