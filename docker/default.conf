#------------------------------------------------------------------------------
# Server-Block für die ausgelieferte Single-Page-App.
#
# Ergänzung zur Standard-Konfiguration des nginx-Abbilds, keine Ablösung:
# Worker, MIME-Typen, gzip und Logging bringt das Abbild bereits mit. Nötig
# sind nur drei Dinge, die es nicht wissen kann.
#
# 1. Die App hat eigene Adressen (/rebalancing, /assets, /settings), zu denen
#    keine Dateien gehören — das Routing macht der Browser. Ohne den Rückfall
#    auf die index.html endet ein Reload auf einer Unterseite im 404.
# 2. config.js wird beim Start des Containers geschrieben und entscheidet,
#    welches Backend die App anspricht. Aus dem Cache wäre sie wertlos.
# 3. Gebündelte Dateien tragen einen Hash im Namen und dürfen deshalb lange
#    im Cache bleiben — die index.html darf das nicht. Sie liegen unter
#    /static/, nicht unter /assets/: Letzteres ist eine Adresse der App.
#------------------------------------------------------------------------------

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Für den Healthcheck — ohne Logeintrag, sonst steht alle 30 Sekunden
    # eine Zeile im Protokoll.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /config.js {
        add_header Cache-Control "no-store" always;
    }

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
